<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg:#111317; --surface:#171a20; --raised:#1e222a; --hover:#262b35; --active:#343a47; --border:#2a2f3a;
    --text:#e6e8ec; --muted:#9aa1ae; --faint:#6c7381; --accent:#7c9cff; --accent-soft:#232c4a;
    --running:#6fd6a0; --star:#ffd166; --cover-w:150px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif; font-size:13px; }
  .titlebar { height:40px; display:flex; align-items:center; gap:10px; padding:0 0 0 14px; border-bottom:1px solid var(--border); background:var(--surface); }
  .titlebar .brand { font-weight:600; display:flex; gap:8px; align-items:center; width:186px; }
  .titlebar .brand i { width:18px; height:18px; border-radius:5px; background:var(--accent); display:inline-block; }
  .cmd { flex:0 1 420px; margin:0 auto; height:28px; border-radius:8px; background:var(--raised); border:1px solid var(--border); color:var(--faint); display:flex; align-items:center; justify-content:space-between; padding:0 10px; }
  .cmd kbd { font:inherit; font-size:11px; border:1px solid var(--border); border-radius:4px; padding:0 5px; }
  .winbtns { display:flex; color:var(--muted); } .winbtns span { width:44px; text-align:center; }
  .switch { position:absolute; right:150px; top:6px; display:flex; gap:3px; background:#0b0d12e6; border:1px solid var(--border); border-radius:99px; padding:3px; z-index:5; }
  .switch button { background:none; border:none; color:var(--muted); font:inherit; font-size:12px; padding:3px 11px; border-radius:99px; cursor:pointer; }
  .switch button.on { background:var(--accent-soft); color:var(--text); }
  .app { display:flex; height:calc(100vh - 40px); }
  .side { width:200px; background:var(--surface); border-right:1px solid var(--border); padding:12px 8px; flex:none; }
  .side .label { color:var(--faint); font-size:11px; letter-spacing:.06em; margin:14px 8px 6px; }
  .nav { display:flex; justify-content:space-between; padding:7px 10px; border-radius:8px; color:var(--muted); }
  .nav.on { background:var(--accent-soft); color:var(--text); }
  .nav small { color:var(--faint); }
  .page { flex:1; min-width:0; display:none; flex-direction:column; padding:18px 28px 16px; gap:12px; }
  .page.on { display:flex; }
  .shelf-head h2 { margin:0 0 8px; font-size:17px; font-weight:600; }
  /* Room above for the raised hover card and its outline (the scroller clips vertically). */
  .shelf-scroll { overflow-x:auto; overflow-y:hidden; padding:6px 4px 8px; margin-top:-4px; scrollbar-width:thin; scrollbar-color:var(--hover) transparent; }
  .shelf-row { display:flex; gap:14px; width:max-content; margin:0 auto; }

  /* ---------- the card (shared by start page and grid) ---------- */
  .card { width:var(--cover-w); flex:none; background:var(--surface); border-radius:10px; overflow:hidden; cursor:pointer;
    box-shadow:0 0 0 1px var(--border), 0 6px 18px #0008; transition:box-shadow .12s, transform .12s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 0 0 1px var(--active), 0 10px 24px #000a; }
  .card.selected { box-shadow:0 0 0 2px var(--accent), 0 10px 24px #000a; }
  .card-top { height:36px; display:flex; align-items:center; gap:7px; min-width:0; padding:0 8px; }
  .logos { display:flex; gap:4px; flex:none; }
  /* Real provider glyphs: single colour, no background. */
  .logo { width:18px; height:18px; display:grid; place-items:center; color:var(--text); flex:none; position:relative; }
  .logo svg { width:18px; height:18px; display:block; }
  .store-name { font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  /* Several stores: a small dot badge on the primary glyph's corner. */
  .logo.multi { margin-right:2px; }
  .logo .count { position:absolute; right:-3px; bottom:-2px; width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 2px var(--surface); }
  .others { display:none; gap:7px; flex:none; padding-left:3px; }
  .card:hover .logo .count, .card.selected .logo .count { display:none; }
  .card:hover .logo.multi, .card.selected .logo.multi { margin-right:0; }
  .card:hover .others.has, .card.selected .others.has { display:flex; }
  .card:hover .store-name.multi, .card.selected .store-name.multi { display:none; }
  .state { margin-left:auto; flex:none; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; border:1px solid; white-space:nowrap; }
  .state.running { color:var(--running); border-color:#6fd6a055; background:#1c3529; }
  .state.missing { color:var(--muted); border-color:var(--border); background:var(--bg); }
  .cover { position:relative; width:var(--cover-w); aspect-ratio:2/3; overflow:hidden; background:#0d0f13; }
  .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .card.missing .art, .card.missing img { filter:saturate(.4) brightness(.65); }
  .art { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:10px;
    font-weight:800; font-size:calc(var(--cover-w) / 8); line-height:1.05; color:#fffd; text-shadow:0 2px 8px #0008; letter-spacing:.02em; }
  .date { position:absolute; left:8px; bottom:8px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px;
    background:#0b0d12e0; border:1px solid #ffffff1f; white-space:nowrap; }
  .quick { position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .12s; background:#0b0d1233; }
  .card:hover .quick, .card.selected .quick { opacity:1; }
  .quick button { display:inline-flex; gap:6px; align-items:center; min-height:32px; padding:0 18px; border-radius:99px;
    background:var(--accent); border:1px solid var(--accent); color:#0e1220; font:inherit; font-weight:600; cursor:pointer; box-shadow:0 2px 10px #0008; }
  .quick button:hover { background:#96b0ff; }
  .icons { margin-left:auto; display:flex; gap:4px; align-items:center; flex:none; }
  .ico { width:26px; height:26px; border-radius:99px; display:grid; place-items:center; }
  .ico svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ico.star { color:var(--star); } .ico.star svg { fill:currentColor; }
  .ico.hidden { color:var(--faint); }
  .ico.missing { color:var(--muted); background:var(--bg); border:1px solid var(--border); }
  .ico.running { color:var(--running); background:#1c3529; border:1px solid #6fd6a055; position:relative; }
  .ico.running svg { fill:currentColor; width:12px; height:12px; margin-left:1px; }
  .ico.running::after { content:""; position:absolute; inset:-1px; border-radius:99px; border:1px solid var(--running); animation:pulse 1.8s ease-out infinite; will-change:transform, opacity; }
  @keyframes pulse { from { transform:scale(1); opacity:.7; } to { transform:scale(1.6); opacity:0; } }
  /* title over the cover, shown on hover */
  .overlay-title { position:absolute; inset:auto 0 0 0; padding:34px 8px 8px; font-size:12.5px; line-height:1.3; font-weight:600;
    background:linear-gradient(transparent, #000000e6 70%); opacity:0; transform:translateY(6px); transition:opacity .14s, transform .14s;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  body.titles-hover .card:hover .overlay-title, body.titles-hover .card.selected .overlay-title { opacity:1; transform:none; }
  body.titles-hover .card:hover .date, body.titles-hover .card.selected .date { opacity:0; }
  .date { transition:opacity .14s; }
  body.titles-hover .card-bottom { display:none; }

  body.titles-strip .overlay-title { display:none; }
  .card-bottom { display:flex; gap:6px; align-items:flex-start; padding:7px 8px 8px; }
  .title { flex:1; min-width:0; font-size:12.5px; line-height:1.3; height:calc(1.3em * 2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .mark { flex:none; width:16px; text-align:center; line-height:1.3; font-size:13px; }
  .mark.star { color:var(--star); }
  .mark.hidden { color:var(--faint); }

  /* stats */
  .stats { flex:none; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; width:100%; max-width:1180px; margin:0 auto; }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; min-width:0; }
  .panel h3 { margin:0; font-size:13px; font-weight:600; }
  .sub { color:var(--muted); font-size:12px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:8px; }
  .chart { display:flex; align-items:flex-end; gap:10px; height:86px; }
  .bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; justify-content:flex-end; height:100%; }
  .bar i { display:block; width:100%; max-width:46px; background:var(--accent); border-radius:4px 4px 0 0; opacity:.8; min-height:2px; }
  .bar.today i { opacity:1; } .bar em { font-style:normal; color:var(--faint); font-size:11px; }
  .bar span { color:var(--muted); font-size:11px; } .bar.today span { color:var(--text); font-weight:600; }
  .stores { display:grid; grid-template-columns:1fr 1fr; column-gap:22px; }
  .store { display:grid; grid-template-columns:18px 96px 1fr 58px; gap:8px; align-items:center; margin:4px 0; }
  .track { height:8px; background:var(--raised); border-radius:99px; overflow:hidden; }
  .track i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .num { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; } .num b { color:var(--text); }

  /* grid page */
  .toolbar { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .toolbar span { border:1px solid var(--border); border-radius:8px; padding:4px 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, calc(var(--cover-w) + 12px)); gap:16px; justify-content:center; overflow:auto; padding:6px 4px; }
</style>
</head>
<body>
<div class="titlebar">
  <div class="brand"><i></i>Questkeep</div>
  <div class="cmd"><span>🔍&nbsp; Find a game…</span><kbd>Ctrl K</kbd></div>
  <div class="winbtns"><span>–</span><span>□</span><span>✕</span></div>
</div>
<div class="switch">
  <button id="t-home" class="on" data-choice="page-home" onclick="show('home')">Start page</button>
  <button id="t-grid" data-choice="page-grid" onclick="show('grid')">Grid view</button>
  <span style="width:1px;background:var(--border);margin:2px 4px"></span>
  <button id="ti-hover" class="on" data-choice="titles-hover" onclick="setTitles('hover')">Title on hover</button>
  <button id="ti-strip" data-choice="titles-strip" onclick="setTitles('strip')">Title strip</button>
</div>
<div class="app">
  <div class="side">
    <div class="nav on" id="n-home">⌂ Home</div>
    <div class="label">LIBRARY</div>
    <div class="nav" id="n-grid">All games <small>165</small></div>
    <div class="nav">Favorites <small>4</small></div>
    <div class="nav">Installed <small>62</small></div>
    <div class="nav">Recently played <small>87</small></div>
    <div class="label">OTHER</div>
    <div class="nav">Hidden <small>0</small></div>
  </div>
  <div class="page on" id="home">
    <div class="shelf-head"><h2>Recently played</h2></div>
    <div class="shelf-scroll"><div class="shelf-row" id="played"></div></div>
    <div class="shelf-head"><h2>Recently added</h2></div>
    <div class="shelf-scroll"><div class="shelf-row" id="added"></div></div>
    <div style="flex:1"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="page" id="grid">
    <div class="toolbar"><span>Filter</span><span>Sort: Name</span><span>Group: none</span></div>
    <div class="grid" id="gridcards"></div>
  </div>
</div>

function relative(iso) {
  const d = new Date(iso + "T00:00"), n = Math.round((TODAY - d) / 864e5);
  if (n === 0) return "Today"; if (n === 1) return "Yesterday"; if (n < 7) return n + " days ago";
  if (n < 28) return Math.floor(n / 7) + (n < 14 ? " week ago" : " weeks ago");
  return d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() === TODAY.getFullYear() ? "" : " " + d.getFullYear());
}
function card([title, iso, st, flags, appId], i, withDate) {

  const icons = [
    flags.includes("f") ? `<span class="ico star" title="Favorite">${ICON.star}</span>` : "",
    flags.includes("h") ? `<span class="ico hidden" title="Hidden">${ICON.eyeOff}</span>` : "",
    flags.includes("r") ? `<span class="ico running" title="Running">${ICON.play}</span>` : "",
    flags.includes("m") ? `<span class="ico missing" title="Not installed">${ICON.cloud}</span>` : "",
  ].join("");
  const action = flags.includes("r") ? "" : `<div class="quick"><button onclick="event.stopPropagation()">${flags.includes("m") ? "⤓ Install" : "▶ Play"}</button></div>`;
  return `<div class="card ${flags.includes("m") ? "missing" : ""}" onclick="select(this)">

    <div class="cover"><div class="art" style="background:linear-gradient(160deg,${a},${b} 70%,#0d0f13)">${title.split(":")[0].toUpperCase()}</div>
      <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/${appId}/library_600x900.jpg" alt="" loading="lazy" onerror="this.remove()">
      ${withDate ? `<span class="date">${relative(iso)}</span>` : ""}<div class="overlay-title">${title}</div>${action}</div>
    <div class="card-bottom"><div class="title">${title}</div></div></div>`;
}
function select(el) { document.querySelectorAll(".card.selected").forEach(c => c.classList.remove("selected")); el.classList.add("selected"); }
function statsHtml() {
  const max = Math.max(...week.map(w => w[1])), total = week.reduce((s, w) => s + w[1], 0), installed = stores.reduce((s, x) => s + x[3], 0);
  return `<div class="stats" id="stats"><div class="panel"><div class="head"><h3>Playtime, last 7 days</h3><span class="sub">${total.toFixed(1)} h · avg ${(total/7).toFixed(1)} h/day</span></div>
    <div class="chart">${week.map(([d, h]) => `<div class="bar ${d === "Today" ? "today" : ""}"><em>${h ? h.toFixed(1) : "–"}</em><i style="height:${Math.max(2, h / max * 100)}%"></i><span>${d}</span></div>`).join("")}</div></div>
    <div class="panel"><div class="head"><h3>Installed by store</h3><span class="sub">bar = share installed · ${installed} of 757 games</span></div>
    <div class="stores">${stores.map(([n, c, l, i, o]) => `<div class="store" title="${Math.round(i / o * 100)} % of your ${n} games are installed"><span class="logo">${GLYPH[l]}</span><span>${n}</span><div class="track"><i style="width:${i / o * 100}%"></i></div><span class="num"><b>${i}</b> / ${o}</span></div>`).join("")}</div></div></div>`;
}
function layout() {
  document.getElementById("stats").outerHTML = statsHtml();
  const page = document.getElementById("home");
  const statsH = document.getElementById("stats").offsetHeight;
  // Card = top strip 30 + cover (w * 1.5) + title strip ~46 + borders; two shelves with headings.
  const bottom = titles === "strip" ? 46 : 0;
  const free = page.clientHeight - statsH - 12 * 4 - 2 * (27 + 10) - 2 * (36 + bottom + 2) - 34;
  const coverW = Math.max(90, Math.min(240, Math.floor(free / 2 / 1.5)));
  document.documentElement.style.setProperty("--cover-w", coverW + "px");
  document.getElementById("played").innerHTML = played.map((g, i) => card(g, i, true)).join("");
  document.getElementById("added").innerHTML = added.map((g, i) => card(g, i, true)).join("");
  document.getElementById("gridcards").innerHTML = [...played, ...added].sort((x, y) => x[0].localeCompare(y[0])).map((g, i) => card(g, i, false)).join("");
}
function show(p) {
  for (const k of ["home", "grid"]) {
    document.getElementById(k).classList.toggle("on", k === p);
    document.getElementById("t-" + k).classList.toggle("on", k === p);
    document.getElementById("n-" + k).classList.toggle("on", k === p);
  }
  if (p === "grid") document.documentElement.style.setProperty("--cover-w", "150px"); else layout();
}
window.addEventListener("resize", () => { if (document.getElementById("home").classList.contains("on")) layout(); });
document.querySelectorAll(".shelf-scroll").forEach((el) => el.addEventListener("wheel", (e) => {
  if (el.scrollWidth <= el.clientWidth || e.deltaX) return; e.preventDefault(); el.scrollBy({ left: e.deltaY, behavior: "smooth" });
}, { passive: false }));
layout();
</script>
</body>
</html>
