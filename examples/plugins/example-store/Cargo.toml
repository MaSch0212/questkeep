[package]
name = "example-store"
description = "Example Questkeep store plugin: reports the games listed in games.json"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
questkeep-plugin-sdk = { path = "../../../crates/questkeep-plugin-sdk" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
strip = true

# A project of its own, not part of the Questkeep workspace.
[workspace]
