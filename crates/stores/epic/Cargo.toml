[package]
name = "questkeep-store-epic"
description = "Questkeep store plugin: Epic Games"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-store-api = { path = "../../questkeep-store-api" }
questkeep-store-heroic = { path = "../heroic" }
questkeep-store-lutris = { path = "../lutris" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
questkeep-store-api = { path = "../../questkeep-store-api", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
