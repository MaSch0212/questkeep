[package]
name = "questkeep-store-meta"
description = "Questkeep store plugin: Meta Horizon Link (the Meta Quest PC app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-store-api = { path = "../../questkeep-store-api" }
dirs = "7.0.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
