[package]
name = "questkeep-store-amazon"
description = "Questkeep store plugin: Amazon Games"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-store-api = { path = "../../questkeep-store-api" }
questkeep-store-heroic = { path = "../heroic" }
base64 = "0.22.1"
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
questkeep-store-api = { path = "../../questkeep-store-api", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
