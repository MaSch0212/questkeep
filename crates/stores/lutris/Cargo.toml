[package]
name = "questkeep-store-lutris"
description = "Questkeep store plugin: Lutris"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-store-api = { path = "../../questkeep-store-api" }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tracing = "0.1.44"

[dev-dependencies]
questkeep-store-api = { path = "../../questkeep-store-api", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
