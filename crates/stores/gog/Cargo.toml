[package]
name = "questkeep-store-gog"
description = "Questkeep store plugin: GOG"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-store-api = { path = "../../questkeep-store-api" }
questkeep-store-heroic = { path = "../heroic" }
questkeep-store-lutris = { path = "../lutris" }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
ureq = "3.4.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[dev-dependencies]
questkeep-store-api = { path = "../../questkeep-store-api", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
