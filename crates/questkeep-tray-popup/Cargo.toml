[package]
name = "questkeep-tray-popup"
description = "The Questkeep tray popup (Windows, Win32 + Direct2D)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Windows only: elsewhere the crate is empty and the app keeps the native tray menu.
[target.'cfg(windows)'.dependencies]
questkeep-imaging = { path = "../questkeep-imaging" }
tracing = "0.1.44"
uuid = "1.28.0"
# Win32 window + Direct2D/DirectWrite; versions are the ones Tauri already locks.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"
# Screen-reader support (UI Automation).
accesskit = "0.25.1"
accesskit_windows = "0.35.1"

[target.'cfg(windows)'.dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"

[lints]
workspace = true
