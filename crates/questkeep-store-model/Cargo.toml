[package]
name = "questkeep-store-model"
description = "What Questkeep stores report: games, play actions, metadata and store settings. Plain serde data shared by the app, store crates and WASM store plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings", "chrono-impl"] }

[lints]
workspace = true
