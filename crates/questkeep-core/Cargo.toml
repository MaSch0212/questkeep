[package]
name = "questkeep-core"
description = "Core library of the Questkeep game launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
questkeep-imaging = { path = "../questkeep-imaging" }
questkeep-store-api = { path = "../questkeep-store-api" }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings", "chrono-impl", "uuid-impl"] }
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
# Backup archives; the version is the one already locked.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# Executable icons (USER32 + GDI) and process checks; the version is the one already locked.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
questkeep-store-api = { path = "../questkeep-store-api", features = ["testing"] }
tempfile = "3.27.0"

[lints]
workspace = true
