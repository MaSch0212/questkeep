[package]
name = "questkeep-core"
description = "Core library of the Questkeep game launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# PKCE (Amazon sign-in) and reading JWT expiry (Steam web session); versions already locked.
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
# Decoding and resizing of icons only; PNG/JPEG/ICO cover everything the sources deliver.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sysinfo = "0.39.6"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings", "chrono-impl", "uuid-impl"] }
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
# Executable icons (USER32 + GDI); the version is the one already locked.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3.6.3", features = ["windows-native"] }

# Linux uses the Secret Service (libdbus; sign-in tokens never fall back to plain files). The
# pure-Rust crypto feature avoids an OpenSSL dependency.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
