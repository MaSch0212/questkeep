name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  windows:
    name: Windows (gates + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Release scripts
        run: node --test scripts/release/*.test.mjs

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Generated TS bindings are up to date
        run: git diff --exit-code -- ui/src/bindings

      - name: oxfmt
        run: pnpm --dir ui format:check

      - name: oxlint
        run: pnpm --dir ui lint --deny-warnings

      - name: tsc
        run: pnpm --dir ui typecheck

      - name: vitest
        run: pnpm --dir ui test

      - name: Build app
        run: pnpm tauri build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: questkeep-windows
          path: |
            target/release/questkeep.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Linux (gates + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file \
            libdbus-1-dev pkg-config

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Release scripts
        run: node --test scripts/release/*.test.mjs

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: TypeScript gates
        run: |
          pnpm --dir ui format:check
          pnpm --dir ui lint --deny-warnings
          pnpm --dir ui typecheck
          pnpm --dir ui test

      - name: Build app (no bundle)
        run: pnpm tauri build --no-bundle

  changeset:
    name: Changeset reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Informational only: never fails the build.
      - name: Warn when a code change has no changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          code="$(printf '%s\n' "$changed" | grep -Ev '^$|^docs/|^\.github/|\.md$' || true)"
          if [ -z "$code" ]; then
            echo "Only docs, workflow or markdown files changed: no changeset needed."
          elif printf '%s\n' "$changed" | grep -Eq '^\.changeset/.+\.md$'; then
            echo "Changeset found."
          else
            echo "::warning title=No changeset::This pull request changes code but adds no changeset. If the change is user-visible, run 'pnpm changeset add <major|minor|patch> \"summary\"' (see docs/RELEASING.md)."
          fi
