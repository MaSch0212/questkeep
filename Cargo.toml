[workspace]
resolver = "3"
members = ["crates/questkeep-*", "crates/stores/*", "src-tauri"]
# Example plugins are projects of their own (built for wasm32-wasip2).
exclude = ["examples"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/questkeep/questkeep"
authors = ["Marc Schmidt"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Debug builds: file/line backtraces for our crates, no debug info for dependencies. Full debug
# info made target/ grow by hundreds of GB on Windows (PDBs, incremental caches).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true
