[workspace]
resolver = "3"
members = ["crates/questkeep-*", "crates/stores/*", "src-tauri"]
# Example plugins are projects of their own (built for wasm32-wasip2).
exclude = ["examples"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/questkeep/questkeep"
authors = ["Marc Schmidt"]

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Debug builds: file/line backtraces for our crates, no debug info for dependencies. Full debug
# info made target/ grow by hundreds of GB on Windows (PDBs, incremental caches).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Decoding and scaling images is 10-30x slower unoptimized: the tray popup took ~500 ms to open in
# debug builds (covers decoded and scaled), a few ms in release. These keep dev builds close to
# what users get; the rest of the dev build stays unoptimized for fast compiles.
[profile.dev.package.questkeep-imaging]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
